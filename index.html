<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <script src="script.js" defer></script>
</head>
<body>
    <style type="text/css">
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            align-items: center;
        }    

        .organization {
          display: flex;
          gap: 4px;
        }

        .buttons {
            display: flex;
            gap: 5px;
        }

        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #020024;
            transition: 0.3s ease;
            color: white;
        }

        .btn:hover {
            background: #868686;
        }
    </style>
      
    <div class="organization"><p id="time">00</p><p>:</p><p id="minute">00</p><p>:</p><p id="second">00</p></div>

    <div class="buttons">
        <button id="start" class="btn">Iniciar</button>
        <button id="clear" class="btn">Limpar</button>
    </div>
</body>
</html>
