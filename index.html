<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <script src="script.js" defer></script>
</head>
<body>
    <style type="text/css">
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            align-items: center;
        }    

        .organization {
          display: flex;
          gap: 4px;
        }

        .buttons {
            display: flex;
            gap: 5px;
        }
    </style>
      
    <div class="organization"><p id="time">00</p><p>:</p><p id="minute">00</p><p>:</p><p id="second">00</p></div>

    <div class="buttons">
        <button id="start">Iniciar</button>
        <button id="clear">Limpar</button>
    </div>
</body>
</html>
