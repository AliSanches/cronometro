<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="/time.png">

    <title>Cronômetro</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container-main" id="container-main">
        <div>
            <h1>CRONÔMETRO</h1>
        </div>

        <div class="organization">
            <p id="time">00</p>
            <p>:</p>
            <p id="minute">00</p>
            <p>:</p>
            <p id="second">00</p>
        </div>

        <div class="buttons">
            <button id="start" class="btn">Iniciar</button>
            <button id="clear" class="btn">Reiniciar</button>
            <button id="save" class="btn">Salvar</button>
            <!-- <button id="plan" class="btn">Agendar</button> -->
        </div>

        <div class="container-modal" id="container-modal">
            <div class="modal">
                <label for="taskInputModal">Tarefa</label>
                <input type="text" id="taskInputModal" name="taskModal">
                <input type="time" id="taskTime">

                <div class="buttonsModal">
                    <button class="btn" id="cancelModal">Cancelar</button>
                    <button class="btn" id="aplicTime">Aplicar</button>
                </div>
            </div>
        </div>

        <div class="container-task">
            <label for="taskInput">Tarefa</label>
            <input type="text" name="task" id="taskInput">
        </div>

        <div class="scroll" id="scroll">
            <table id="indice"></table>
            <div class="displayNone" id="container-clear">
                <button id="clearTable" class="btn">Limpar Tarefas</button>
            </div>
        </div>
    </div>
</body>

</html>
